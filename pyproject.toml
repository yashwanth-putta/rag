
[project]
name = "rag"
version = "0.1.0"
description = "Ingestion, Inference and Evaluation Pipelines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.6.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.0.0",
    "numpy"
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.8,<0.10"]
build-backend = "uv_build"

